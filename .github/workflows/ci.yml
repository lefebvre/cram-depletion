name: ci

on:
  push:
  pull_request:

jobs:
  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: clang-format --dry-run
        run: |
          clang-format --dry-run -Werror \
            cram/*.hpp cram/*.cpp \
            cram-apps/*.cpp \
            tests/*.hpp tests/*.cpp \
            tests/integration/*.cpp \
            testing/*.hpp \
            bench/*.cpp

  build-test-coverage:
    needs: format-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libeigen3-dev libgtest-dev \
                                   gcovr cppcheck clang-tidy

      # Benchmarks are built (not run) here so bench/ cannot bit-rot: it was
      # previously compiled by no CI job at all. Timings are deliberately not
      # gated -- hosted runners are far too noisy for that to mean anything.
      - name: Configure (Debug + coverage + benchmarks)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCRAM_ENABLE_COVERAGE=ON \
                -DCRAM_ENABLE_BENCHMARKS=ON -DCRAM_WERROR=ON

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Coverage HTML + threshold (gcovr)
        run: |
          mkdir -p build/coverage-html
          gcovr --root . --filter 'cram/' \
                --exclude 'tests/' --exclude 'cram-apps/' \
                --fail-under-line 95 --print-summary \
                --html-details build/coverage-html/index.html \
                --xml build/coverage-html/cobertura.xml

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage-html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage-html/cobertura.xml
          fail_ci_if_error: false
          flags: unittests

  windows-build-test:
    needs: format-check
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC, FetchContent pulls Eigen + GTest)
        run: >
          cmake -B build -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release
          -DCRAM_WERROR=ON

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure

  eigen-fetch:
    needs: format-check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        eigen_tag: ["3.4.0", "5.0.1"]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (deliberately no libeigen3-dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtest-dev

      - name: Configure (Eigen ${{ matrix.eigen_tag }} via FetchContent)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DCRAM_EIGEN_GIT_TAG=${{ matrix.eigen_tag }} \
                -DCRAM_WERROR=ON

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # Installs cram to a prefix and builds an external consumer against the
  # installed package only. Catches export regressions that an in-tree build
  # cannot see: a source-tree path leaking into the exported interface, a
  # PUBLIC dependency missing from the export set, or a public header that was
  # added but never installed.
  install-consume:
    needs: format-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # libeigen3-dev, not the fetch fallback: installing requires a system
      # Eigen, since a fetched one is a build-tree target that is never
      # installed. See the install policy block in the top-level CMakeLists.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libeigen3-dev

      - name: Configure, build, install
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DCRAM_ENABLE_TESTS=OFF -DCRAM_WERROR=ON \
                -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build -j
          cmake --install build

      - name: find_package(cram) from outside the source tree
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(cram_consumer LANGUAGES CXX)
          find_package(cram 1.0 REQUIRED)
          add_executable(use_cram main.cpp)
          target_link_libraries(use_cram PRIVATE cram::cram)
          EOF
          cat > main.cpp <<'EOF'
          #include <cram/cram.hpp>
          #include <cram/version.hpp>
          #include <cstdio>
          int main() {
            Eigen::SparseMatrix<double> A(2, 2);
            A.insert(0, 0) = -0.5;
            A.insert(1, 0) = 0.5;
            A.makeCompressed();
            Eigen::VectorXd n0(2);
            n0 << 1.0, 0.0;
            const Eigen::VectorXd n = cram::cramSolve(A, n0, 2.0);
            std::printf("cram %s -> %.10f\n", cram::kVersion, n(0));
            // exp(-0.5 * 2) = e^-1, and the chain conserves mass.
            return (std::abs(n(0) - 0.36787944117144233) < 1e-9 &&
                    std::abs(n(0) + n(1) - 1.0) < 1e-12) ? 0 : 1;
          }
          EOF
          cmake -B b -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/prefix"
          cmake --build b -j
          ./b/use_cram

      - name: Installed deplete reports the project version
        run: ./prefix/bin/deplete --version

  # The version lives in exactly one place -- project(VERSION) in the top-level
  # CMakeLists -- and a release tag is a claim about it. This job makes a
  # disagreeing tag fail rather than ship a binary whose --version contradicts
  # the tag it was cut from.
  version-tag-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match project(VERSION)
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          project=$(sed -n 's/^project(cram_depletion VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "tag=$tag project=$project"
          if [ -z "$project" ]; then
            echo "could not parse VERSION out of project() in CMakeLists.txt" >&2
            exit 1
          fi
          if [ "$tag" != "$project" ]; then
            echo "tag v$tag disagrees with project(VERSION) $project;" \
                 "bump CMakeLists.txt or retag" >&2
            exit 1
          fi

  sanitizers:
    needs: format-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libeigen3-dev libgtest-dev
      - name: Build + test with ASan/UBSan
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCRAM_ENABLE_SANITIZERS=ON \
                -DCRAM_WERROR=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  # ThreadSanitizer needs a build of its own -- it cannot be combined with the
  # ASan/UBSan job above. The library is single-threaded today, so this job finds
  # nothing; it exists so the guard is already in place before prepare() is
  # parallelized. Note that TSan reports false positives against an
  # uninstrumented OpenMP runtime and against libstdc++'s TBB-backed parallel
  # algorithms, so concurrency here should be plain std::thread/std::async.
  thread-sanitizer:
    needs: format-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libeigen3-dev libgtest-dev
      # Kernels since ~6.6 hand out more ASLR entropy than ThreadSanitizer's
      # shadow mapping allows for, and it aborts at startup with "unexpected
      # memory mapping" before running a line of test code. Lowering the
      # randomisation is the documented fix. Tolerated if it fails, since the
      # setting is unnecessary on kernels that never had the problem.
      - name: Widen TSan's address space
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true
      - name: Build + test with TSan
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCRAM_ENABLE_TSAN=ON \
                -DCRAM_WERROR=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  clang-build-test:
    needs: format-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libeigen3-dev libgtest-dev
      - name: Configure + build + test (clang)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCRAM_WERROR=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  static-analysis:
    needs: format-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libeigen3-dev libgtest-dev cppcheck clang-tidy
      - name: Configure (exports compile_commands.json)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug
      - name: cppcheck
        run: cmake --build build --target cppcheck
      # tests/ was previously outside every analyzer: cppcheck is pointed at
      # cram/ only and this step listed cram/*.cpp, so nothing ever inspected
      # test sources.
      - name: clang-tidy
        run: clang-tidy -p build cram/*.cpp tests/*.cpp

  endftk-integration:
    needs: format-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libeigen3-dev libgtest-dev
      - name: Build with ENDFtk reader (FetchContent pulls ENDFtk + deps)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCRAM_WITH_ENDFTK=ON \
                -DCRAM_WERROR=ON
          cmake --build build -j
      - name: Run integration tests against real ENDF data
        run: ctest --test-dir build -R EndfReaderIntegration --output-on-failure

  # Windows counterpart of endftk-integration. MSVC ships a complete <format>,
  # so this is the configuration that exercises the consteval format-string
  # path through spdlog and njoy/tools; the Linux job cannot reach it until
  # libstdc++'s __cpp_lib_format passes 202207 (see #16).
  endftk-integration-windows:
    needs: format-check
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure with ENDFtk reader (MSVC)
        run: >
          cmake -B build -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release
          -DCRAM_WITH_ENDFTK=ON -DCRAM_WERROR=ON

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run integration tests against real ENDF data
        run: >
          ctest --test-dir build --build-config Release
          -R EndfReaderIntegration --output-on-failure
